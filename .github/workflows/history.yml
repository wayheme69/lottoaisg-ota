name: Export history
on: workflow_dispatch
permissions:
  contents: write
concurrency:
  group: results
  cancel-in-progress: false
jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/sg_results.py --history
      - run: |
          git config user.name "results-bot"; git config user.email "actions@github.com"
          git add history.json; git commit -m "history export" || true; git pull --rebase origin main; git push
